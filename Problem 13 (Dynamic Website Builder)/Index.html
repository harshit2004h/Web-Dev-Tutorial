<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Website Builder</title>
    <link rel="stylesheet" href="Style.css" />
    <link
      rel="shortcut icon"
      href="https://icons.iconarchive.com/icons/iconarchive/red-orb-alphabet/256/Letter-P-icon.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="thumb">
        <div class="time"></div>
      </div>
      <div class="info">
        <div class="title"></div>
        <div class="other">
          <div class="channel inner"></div>
          <i class="fa-solid fa-circle dot" style="color: #c9c9c9"></i>
          <div class="views inner"></div>
          <i class="fa-solid fa-circle dot" style="color: #c9c9c9"></i>
          <div class="age inner"></div>
        </div>
      </div>
    </div>
    <script src="Script.js"></script>
</html>

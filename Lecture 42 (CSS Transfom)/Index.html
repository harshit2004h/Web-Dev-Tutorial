<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Transform</title>
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
      }
      .box {
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: larger;
        height: 100px;
        width: 100px;
        background-color: beige;
        border: 5px solid black;

        transform: rotate(45deg);
        /* transform: rotate(0.25turn); */                            /* One turn = 360 degree */
        /* transform: scale(1.5); */
        /* transform: skew(20deg); */
        /* transform: translate(50%);*/                               /* Translates by 50% of the width */
        /* transform: rotate(45deg) scale(1.5) translateX(250px); */  /* Multiple transform properties can be used separated by space*/
        transform-origin: -0% 0%;     /*Default origin is (-50%,50%) i.e. CENTER but here it is set of corner */
          
      }
      .container {
        width: 95vw;
        height: 80vh;
        border: 5px solid purple;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">BOX</div>
    </div>
  </body>
</html>
